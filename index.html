	max-width: 100%;

	width: 100%;

/* iPhone: pin the page and canvas to the screen so Safari can't scroll or rubber-band it (that shifts the game and cuts off the bottom). */
html, body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
#canvas { position: fixed; top: 0; left: 0; }

<script>
/* iOS reports the new screen size late after rotating, resuming the app or closing the address bar: re-send resize a few times so Godot refits. */
(function () {
	function refit() { window.scrollTo(0, 0); window.dispatchEvent(new Event('resize')); }
	function soon() { [60, 250, 600, 1200].forEach(function (t) { setTimeout(refit, t); }); }
	window.addEventListener('orientationchange', soon);
	window.addEventListener('pageshow', soon);
	document.addEventListener('visibilitychange', function () { if (!document.hidden) { soon(); } });
	if (window.visualViewport) { window.visualViewport.addEventListener('resize', function () { setTimeout(refit, 60); }); }
	window.addEventListener('scroll', function () { if (window.scrollY || window.scrollX) { window.scrollTo(0, 0); } });
})();
</script>
<script>
/* Web music (Music.gd calls window.AbyssMusic): one streaming <audio> element through a Web Audio gain.
   Godot's own web audio decodes a whole song into one huge buffer; on iPhone the battle themes never started.
   Browsers only allow sound after a tap, so every tap resumes audio and retries a track that was refused. */
(function () {
	var el = null, ctx = null, gain = null, cur = '', token = 0, vol = 1, blessed = false;
	function setup() {
		if (el) { return; }
		el = new Audio();
		el.loop = true;
		el.preload = 'auto';
		el.setAttribute('playsinline', '');
		var AC = window.AudioContext || window.webkitAudioContext;
		if (AC) {
			try {
				ctx = new AC();
				gain = ctx.createGain();
				gain.gain.value = 0;
				ctx.createMediaElementSource(el).connect(gain);
				gain.connect(ctx.destination);
			} catch (e) { ctx = null; gain = null; }
		}
	}
	function ramp(to, sec) {
		if (gain) {
			var g = gain.gain, t = ctx.currentTime;
			g.cancelScheduledValues(t);
			g.setValueAtTime(g.value, t);
			g.linearRampToValueAtTime(to, t + Math.max(0.01, sec));
		} else if (el) {
			el.volume = Math.max(0, Math.min(1, to));
		}
	}
	function start() {
		if (!el || !cur) { return; }
		if (ctx && ctx.state !== 'running') { ctx.resume(); }
		var p = el.play();
		if (p && p.catch) { p.catch(function () {}); }
	}
	function unlock() {
		setup();
		if (ctx && ctx.state !== 'running') { ctx.resume(); }
		if (cur && el.paused) { start(); }
		else if (!cur && !blessed) {
			/* iPhone: an <audio> element may only start inside a tap; play a silent clip now so later tracks may start. */
			blessed = true;
			el.setAttribute('src', 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=');
			var p = el.play();
			if (p && p.then) { p.then(function () { if (!cur) { el.pause(); } }, function () {}); }
		}
		if (cur) { blessed = true; }
	}
	['touchend', 'pointerup', 'mouseup', 'click', 'keydown'].forEach(function (ev) {
		window.addEventListener(ev, unlock, true);
	});
	document.addEventListener('visibilitychange', function () {
		if (!el) { return; }
		if (document.hidden) { el.pause(); } else if (cur) { start(); }
	});
	window.AbyssMusic = {
		play: function (url, volume, fade) {
			setup();
			token++;
			cur = url;
			vol = volume;
			if (el.getAttribute('src') !== url) { el.setAttribute('src', url); } else { try { el.currentTime = 0; } catch (e) {} }
			if (gain) { gain.gain.cancelScheduledValues(ctx.currentTime); gain.gain.setValueAtTime(0, ctx.currentTime); }
			ramp(volume, fade || 0.01);
			start();
		},
		stop: function (fade, url) {
			if (!el || (url && url !== cur)) { return; }
			token++;
			var mine = token;
			cur = '';
			ramp(0, fade || 0.01);
			setTimeout(function () { if (token === mine) { el.pause(); } }, (fade || 0) * 1000 + 60);
		},
		volume: function (volume, sec) { vol = volume; ramp(volume, sec || 0.01); },
		state: function () {
			return el ? { src: el.getAttribute('src'), paused: el.paused, time: el.currentTime, gain: gain ? gain.gain.value : el.volume, ctx: ctx ? ctx.state : 'none', cur: cur } : null;
		}
	};
})();
</script>

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":22111828,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
